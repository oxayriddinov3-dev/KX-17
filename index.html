function saveState() {
  localStorage.setItem('yhq_is_pro', JSON.stringify(state.isPro));
  localStorage.setItem('yhq_answered', JSON.stringify(state.answeredIds));
  localStorage.setItem('yhq_mistakes', JSON.stringify(state.mistakeIds));
  localStorage.setItem('yhq_bookmarks', JSON.stringify(state.bookmarks));
  localStorage.setItem('yhq_last_exam', JSON.stringify(state.lastExam));
  updateBadges();
}

function updateBadges() {
  const badge = document.getElementById('mistake-badge');
  if (state.mistakeIds.length > 0) {
    badge.textContent = state.mistakeIds.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  const proBtn = document.getElementById('pro-status-btn');
  if (state.isPro) {
    proBtn.textContent = 'MAX PRO ✓';
    proBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300';
  } else {
    proBtn.textContent = 'PRO';
  }
}

// ==================== NAVIGATION & THEME ====================
function navigate(view, params = {}) {
  if (state.timerInterval && view !== 'quiz') {
    clearInterval(state.timerInterval);
  }
  state.view = view;
  if (params.topicId) state.testConfig.topicId = params.topicId;
  if (params.mode) state.testConfig.mode = params.mode;

  // Highlight active nav button
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.remove('bg-brand-600', 'text-white', 'shadow-sm');
    btn.classList.add('text-slate-600', 'dark:text-slate-300', 'hover:bg-slate-100', 'dark:hover:bg-slate-800');
  });
  const activeNav = document.getElementById('nav-' + view);
  if (activeNav) {
    activeNav.classList.remove('text-slate-600', 'dark:text-slate-300', 'hover:bg-slate-100', 'dark:hover:bg-slate-800');
    activeNav.classList.add('bg-brand-600', 'text-white', 'shadow-sm');
  }

  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleTheme() {
  document.documentElement.classList.toggle('dark');
}

function toggleLangMenu() {
  document.getElementById('lang-menu').classList.toggle('hidden');
}

function setLang(lang) {
  state.lang = lang;
  const labels = { uz: 'Uz', oz: 'Ўз', qr: 'Qr', ru: 'Ru' };
  document.getElementById('current-lang-label').textContent = labels[lang];
  document.getElementById('lang-menu').classList.add('hidden');
  applyTranslations();
  render();
}

function applyTranslations() {
  const dict = I18N[state.lang] || I18N.uz;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
}

// ==================== RENDER ROUTER ====================
function render() {
  const container = document.getElementById('app-container');
  switch (state.view) {
    case 'home': container.innerHTML = renderHome(); break;
    case 'topics': container.innerHTML = renderTopics(); break;
    case 'signs': container.innerHTML = renderSigns(); break;
    case 'test-setup': container.innerHTML = renderTestSetup(); break;
    case 'quiz': container.innerHTML = renderQuiz(); break;
    case 'results': container.innerHTML = renderResults(); break;
    case 'questions': container.innerHTML = renderQuestionsBank(); break;
    case 'mistakes': container.innerHTML = renderMistakes(); break;
    case 'pricing': container.innerHTML = renderPricing(); break;
  }
  applyTranslations();
}

function renderTopics() {

      </div>
      <input type="text" oninput="filterTopics(this.value)" placeholder="Mavzu bo'yicha qidirish..." class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm w-full sm:w-64 focus:outline-none focus:border-brand-600" />
    </div>

    <div id="topics-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${TOPICS.map(t => `
        <div class="topic-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-sm hover:border-brand-500 transition" data-title="${t.title.toLowerCase()}">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-[11px] font-bold uppercase tracking-wider text-brand-600 bg-blue-50 dark:bg-blue-950 px-2.5 py-1 rounded-lg">MAVZU ${t.id}</span>
              <span class="text-xs text-slate-400 font-medium">${t.count} savol</span>
            </div>
            <h3 class="font-bold text-base text-slate-900 dark:text-white mb-2">${t.title}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-5">${t.desc}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="startTopicPractice(${t.id})" class="flex-1 py-2.5 px-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold transition flex items-center justify-center gap-1.5">
              <span>▶ Amaliyot</span>
            </button>
            <button onclick="viewTopicQuestions(${t.id})" class="py-2.5 px-3.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-semibold transition">
              Ko'rish
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function filterTopics(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.topic-card').forEach(card => {
    card.style.display = card.dataset.title.includes(q) ? 'flex' : 'none';
  });
}

// ==================== VIEW 3: ROAD SIGNS ====================
function renderSigns() {
  const cats = [
    { id: 'all', label: "Barcha belgilar (253)" },
    { id: 'warning', label: "Ogohlantiruvchi belgilar (42)" },
    { id: 'priority', label: "Imtiyoz belgilari (13)" },
    { id: 'prohibitory', label: "Taqiqlovchi belgilar (43)" },
    { id: 'mandatory', label: "Buyuruvchi belgilar (19)" },
    { id: 'info', label: "Axborot-ishora belgilari (62)" },
    { id: 'service', label: "Servis belgilari (19)" }
  ];

  const filtered = state.signCat === 'all' ? ROAD_SIGNS : ROAD_SIGNS.filter(s => s.cat === state.signCat);

  const renderBadgeVisual = (s) => {
    if (s.shape === 'triangle') {
      return `<div class="w-20 h-20 flex items-center justify-center relative">
        <svg viewBox="0 0 100 90" class="w-20 h-20"><polygon points="50,6 95,84 5,84" fill="#fff" stroke="#ef4444" stroke-width="8" stroke-linejoin="round"/></svg>
        <span class="absolute mt-3 text-xl">${s.symbol}</span>
      </div>`;
    }
    if (s.shape === 'diamond') {
      return `<div class="w-16 h-16 rotate-45 bg-amber-400 border-4 border-white shadow flex items-center justify-center">
        <span class="-rotate-45 text-xs font-bold text-slate-900">${s.code}</span>
      </div>`;
    }
    if (s.shape === 'circle-red' || s.shape === 'circle-red-fill') {
      return `<div class="w-20 h-20 rounded-full ${s.shape === 'circle-red-fill' ? 'bg-red-600 text-white' : 'bg-white text-slate-900'} border-[7px] border-red-600 flex items-center justify-center font-extrabold text-xl shadow-sm">
        ${s.symbol}
      </div>`;
    }
    if (s.shape === 'circle-blue') {
      return `<div class="w-20 h-20 rounded-full bg-brand-600 border-4 border-white text-white flex items-center justify-center text-2xl shadow-sm">
        ${s.symbol}
      </div>`;
    }
    return `<div class="w-20 h-24 rounded-xl bg-brand-600 border-4 border-white text-white flex items-center justify-center text-2xl font-extrabold shadow-sm">
      ${s.symbol}
    </div>`;
  };

  return `
    <div class="mb-6">
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Yo'l harakati belgilari</h1>
      <p class="text-xs text-slate-500 mt-1">O'zbekiston yo'l harakati qoidalari bo'yicha 253 ta rasmiy yo'l belgisi — turkumlar bo'yicha tartiblangan.</p>
    </div>

    <!-- Category Pills -->
    <div class="flex flex-wrap gap-2 mb-6">
      ${cats.map(c => `
        <button onclick="state.signCat='${c.id}'; render();" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${state.signCat === c.id ? 'bg-brand-600 text-white shadow-sm' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:border-brand-500'}">
          ${c.label}
        </button>
      `).join('')}
    </div>

    <!-- Signs Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      ${filtered.map(s => `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex flex-col items-center text-center shadow-sm hover:border-brand-500 transition">
          <div class="h-24 flex items-center justify-center mb-3">
            ${renderBadgeVisual(s)}
          </div>
          <div class="text-xs font-bold text-brand-600 mb-1">${s.code}</div>
          <div class="text-xs text-slate-700 dark:text-slate-300 font-medium leading-snug">${s.name}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ==================== QUIZ ENGINE ====================
function startQuickExam() {
  state.testConfig.mode = 'exam';
  state.testConfig.count = 20;
  state.testConfig.topicId = 'all';
  launchQuiz();
}

function startTopicPractice(topicId) {
  state.testConfig.mode = 'practice';
  state.testConfig.topicId = topicId;
  state.testConfig.count = 20;
  launchQuiz();
}

function startMode(mode, count) {
  state.testConfig.mode = mode;
  state.testConfig.count = count;
  launchQuiz();
}

function launchQuiz() {
  let pool = [...QUESTIONS];
  if (state.testConfig.topicId !== 'all') {
    const filtered = pool.filter(q => q.topicId == state.testConfig.topicId);
    if (filtered.length > 0) pool = filtered;
  }
  // Repeat pool if needed to reach requested count up to 20
  const targetLen = state.testConfig.mode === 'exam' ? 20 : Math.min(20, state.testConfig.count);
  let sessionQuestions = [];
  while (sessionQuestions.length < targetLen) {
    sessionQuestions = sessionQuestions.concat([...pool].sort(() => Math.random() - 0.5));
  }
  sessionQuestions = sessionQuestions.slice(0, targetLen);

  state.quiz = {
    mode: state.testConfig.mode,
    questions: sessionQuestions,
    currentIdx: 0,
    answers: new Array(sessionQuestions.length).fill(null),
    secondsLeft: state.testConfig.mode === 'blitz' ? 60 : 25 * 60,
    elapsed: 0
  };

  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (!state.quiz) return;
    state.quiz.elapsed++;
    if (state.quiz.mode === 'exam' || state.quiz.mode === 'blitz') {
      state.quiz.secondsLeft--;
      const timerEl = document.getElementById('quiz-timer');
      if (timerEl) timerEl.textContent = formatTime(state.quiz.secondsLeft);
      if (state.quiz.secondsLeft <= 0) finishQuiz();
    }
  }, 1000);

  navigate('quiz');
}

function formatTime(sec) {
  const m = String(Math.floor(Math.max(0, sec) / 60)).padStart(2, '0');
  const s = String(Math.max(0, sec) % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function selectAnswer(optIdx) {
  const qObj = state.quiz;
  const idx = qObj.currentIdx;
  if (qObj.answers[idx] !== null) return;

  qObj.answers[idx] = optIdx;
  const question = qObj.questions[idx];

  if (!state.answeredIds.includes(question.id)) {
    state.answeredIds.push(question.id);
  }

  if (optIdx === question.correct) {
    state.mistakeIds = state.mistakeIds.filter(id => id !== question.id);
  } else {
    if (!state.mistakeIds.includes(question.id)) {
      state.mistakeIds.push(question.id);
    }
    if (qObj.mode === 'survival') {
      saveState();
      finishQuiz();
      return;
    }
  }
  saveState();
  render();
}

function nextQuestion() {
  const qObj = state.quiz;
  if (qObj.currentIdx + 1 < qObj.questions.length) {
    qObj.currentIdx++;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  const qObj = state.quiz;
  const correct = qObj.answers.filter((a, i) => a !== null && a === qObj.questions[i].correct).length;
  const total = qObj.questions.length;
  const passed = qObj.mode === 'exam' ? (total - correct <= 2 && correct >= 18) : (correct / total >= 0.8);

  state.lastExam = {
    score: correct,
    total: total,
    passed: passed,
    time: formatTime(qObj.elapsed)
  };
  saveState();
  navigate('results');
}

}

function activatePlan(enablePro) {
  state.isPro = enablePro;
  saveState();
  render();
}

// ==================== MODALS & KEYBOARD SHORTCUTS ====================
function openAuthModal() {
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h3 class="text-lg font-extrabold mb-1">Tizimga kirish</h3>
    <p class="text-xs text-slate-500 mb-4">Natijalaringiz va xatolar tarixini barcha qurilmalarda sinxronlash uchun Telegram orqali kiring.</p>
    <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-[#229ED9] hover:opacity-90 text-white font-bold text-sm flex items-center justify-center gap-2 mb-3">
      <span>✈️ Telegram orqali kirish</span>
    </button>
    <button onclick="closeModal()" class="w-full py-2 text-xs text-slate-400">Bekor qilish</button>
  `;
  document.getElementById('modal-backdrop').classList.remove('hidden');
}

function openFeedbackModal() {
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h3 class="text-lg font-extrabold mb-1">Xabar yuborish</h3>
    <p class="text-xs text-slate-500 mb-4">Savolda xatolik topsangiz yoki taklifingiz bo'lsa yozib qoldiring.</p>
    <textarea rows="3" placeholder="Xabaringizni yozing..." class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs mb-3"></textarea>
    <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-brand-600 text-white font-bold text-xs">Yuborish</button>
  `;
  document.getElementById('modal-backdrop').classList.remove('hidden');
}

function closeModal(e) {
  if (!e || e.target.id === 'modal-backdrop') {
    document.getElementById('modal-backdrop').classList.add('hidden');
  }
}

// Keyboard shortcuts (1, 2, 3, 4, Enter/Space) during Quiz
document.addEventListener('keydown', (e) => {
  if (state.view !== 'quiz' || !state.quiz) return;
  const q = state.quiz.questions[state.quiz.currentIdx];
  if (['1', '2', '3', '4'].includes(e.key)) {
    const idx = parseInt(e.key) - 1;
    if (idx < q.options.length) selectAnswer(idx);
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    nextQuestion();
  }
});

// Initialize App
updateBadges();
navigate('home');
</script>
